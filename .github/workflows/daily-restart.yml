name: Daily Restart

on:
  schedule:
    # Midnight UTC, right at the daily-race rollover: the restarted backend
    # eagerly creates the new day's race on boot (DAILY_EAGER_CREATE in fly.toml).
    - cron: '0 0 * * *'

  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  restart:
    name: Restart Fly.io Machines
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restart Backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps restart vim-racing-server

      - name: Restart Matchmaking
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps restart vim-racing-matchmaker
