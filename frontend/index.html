<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Practice VIM motions online by racing! Improve your VIM speed and accuracy by competing against others or yourself."
    />
    <meta property="og:title" content="VIMGYM" />
    <meta
      property="og:description"
      content="Practice VIM motions online by racing! Improve your VIM speed and accuracy by competing against others or yourself."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vimgym.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VIMGYM" />
    <meta
      name="twitter:description"
      content="Practice VIM motions online by racing! Improve your VIM speed and accuracy by competing against others or yourself."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=optional"
    />
    <link rel="apple-touch-icon" href="/favicon/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <title>VIMGYM</title>
    <!-- Inline critical CSS: hides the mobile overlay before index.css (loaded via JS module import) can apply, avoiding a flash of its content on first paint. -->
    <style>
      #mobile-overlay {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="mobile-overlay">
      <div id="mobile-overlay-content">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#06b6d4"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        <h1 id="mobile-overlay-title">VIM_GYM</h1>
        <p id="mobile-overlay-msg">
          Practice VIM motions by racing online. Best experienced on desktop —
          open on a computer to play.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
