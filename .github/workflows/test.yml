name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npx vitest run --coverage
        working-directory: backend

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run --coverage
        working-directory: frontend

  matchmaking:
    name: Matchmaking Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: matchmaking
      - run: npx vitest run --coverage
        working-directory: matchmaking

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      # taskPool.ts loads the piscina worker from dist/ even under tsx,
      # so the backend must be compiled before the tests spawn it.
      - run: npm run build
        working-directory: backend
      # quickplayFullFlow spawns the matchmaker from matchmaking/src,
      # which needs its own dependencies installed.
      - run: npm ci
        working-directory: matchmaking
      - run: npm run test:integration
        working-directory: backend
