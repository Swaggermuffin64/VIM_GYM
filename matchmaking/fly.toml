app = "vim-racing-matchmaker"
primary_region = "iad"

# IMPORTANT: This service uses an in-memory matchmaking queue, so it MUST run
# on a single machine. Multiple machines = separate queues = players can't match.
# After deploying, ensure: fly scale count 1

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Required for queue auth: REQUIRE_AUTH derives from NODE_ENV. The
  # matchmaker also needs the SUPABASE_JWT_SECRET (or SUPABASE_URL) secret
  # set via `fly secrets set` so it can verify Supabase access tokens.
  NODE_ENV = "production"
  PLAYERS_PER_MATCH = "2"
  GAME_SERVER_URL = "https://vim-racing-server.fly.dev"
  FRONTEND_URL = "https://vimgym.app,https://www.vimgym.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep running for matchmaking queue
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

