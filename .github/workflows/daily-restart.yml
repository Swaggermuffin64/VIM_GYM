name: Daily Restart

on:
  schedule:
    # 05:00 UTC — the global traffic trough (1am US Eastern, 7am Central
    # Europe). Race-of-the-day creation no longer depends on this restart:
    # the backend's in-process rollover scheduler (daily/dailyRolloverScheduler.ts)
    # creates each day's race at UTC midnight. This restart is process hygiene
    # (fresh memory, fresh task cache) and can run at the quietest hour.
    - cron: '0 5 * * *'

  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  restart:
    name: Restart Fly.io Machines
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restart Backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps restart vim-racing-server

      - name: Restart Matchmaking
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps restart vim-racing-matchmaker
